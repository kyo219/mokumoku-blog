project:
  type: website

lang: ja

website:
  title: "mokumoku blog"
  description: "勉強したことを少しずつ記録するブログ"
  # 公開URL（README の「公開URLとパス」を参照）。sitemap などの絶対URLに使われます。
  site-url: "https://kyo219.github.io/mokumoku-blog/"
  # 下書き（draft: true）の扱い。gone = ビルド結果から除外し、一覧・検索・サイトマップにも出さない
  draft-mode: gone
  # ヘッダーに検索欄を置く
  search:
    location: navbar
    type: textbox
  navbar:
    left:
      - href: index.qmd
        text: 記事一覧
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/kyo219/mokumoku-blog
        aria-label: GitHub リポジトリ
  page-footer:
    left: "© 2026 mokumoku blog"
    right: "Built with [Quarto](https://quarto.org/)"

# 画面に出るラベルの日本語を調整
language:
  title-block-published: "投稿日"
  search-text-placeholder: "記事を検索"
  listing-page-field-categories: "タグ"

format:
  html:
    theme:
      light: [cosmo, theme.scss]
    toc: true
    toc-location: right-body
    toc-depth: 3
    toc-title: 目次
    code-copy: true
    highlight-style: monokai
    code-overflow: wrap
    code-fold: false
    code-summary: "コードを表示"
    smooth-scroll: true

# Python コードはビルドのたびに実行する（凍結 freeze は使わない）
execute:
  echo: true
  warning: false
